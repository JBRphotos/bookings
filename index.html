<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jesse Reilly Photography</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #0a1628;
      --secondary: #1e3a5f;
      --accent: #c9a45c;
      --light: #f8f9fb;
      --white: #ffffff;
    }

    body {
      font-family: 'Work Sans', sans-serif;
      color: var(--primary);
      line-height: 1.6;
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(10,22,40,0.95);
      padding: 20px 0;
      z-index: 1000;
    }

    nav .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-nav {
      display: flex;
      align-items: center;
      gap: 15px;
      color: var(--white);
      text-decoration: none;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.4rem;
    }

    .logo-nav img {
      width: 45px;
      height: 45px;
    }

    nav ul {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    nav a {
      color: var(--white);
      text-decoration: none;
      font-size: 0.95rem;
    }

    /* Hero */
    .hero {
      height: 100vh;
      background:
        linear-gradient(rgba(10,22,40,0.85), rgba(10,22,40,0.85)),
        url("images/hero.jpg") center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--white);
      padding: 0 20px;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 40px;
    }

    .cta-button {
      padding: 15px 40px;
      background: var(--accent);
      color: var(--primary);
      text-decoration: none;
      border-radius: 40px;
      font-weight: 600;
    }

    section {
      padding: 100px 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .section-header {
      text-align: center;
      margin-bottom: 60px;
    }

    .section-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      margin-bottom: 15px;
    }

    /* About */
    #about {
      background: var(--light);
    }

    .about-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .about-image {
      width: 100%;
      height: 500px;
      object-fit: cover;
      border-radius: 20px;
    }

    /* Carousel */
    .carousel-container {
      overflow: hidden;
      margin-top: 40px;
    }

    .carousel-track {
      display: flex;
      gap: 25px;
      animation: scroll 30s linear infinite;
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .carousel-item {
      flex: 0 0 380px;
      height: 260px;
      overflow: hidden;
      border-radius: 15px;
    }

    .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Photo Grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
      margin-top: 60px;
    }

    .photo-item {
      position: relative;
      overflow: hidden;
      border-radius: 15px;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10,22,40,0.8);
      padding: 20px;
      text-align: center;
    }

    .buy-print-btn {
      background: var(--accent);
      color: var(--primary);
      padding: 10px 25px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
    }

    /* Footer */
    footer {
      background: var(--primary);
      color: var(--white);
      text-align: center;
      padding: 30px 20px;
    }

    @media (max-width: 768px) {
      .about-content {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>

<body>

  <!-- NAV -->
  <nav>
    <div class="container">
      <a href="#" class="logo-nav">
        <img src="images/logo.png" alt="Logo">
        JBR Photos
      </a>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#portfolio">Portfolio</a></li>
        <li><a href="#gallery">Shop</a></li>
      </ul>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div>
      <h1>Jesse Reilly</h1>
      <p>Sports & Portrait Photography</p>
      <a href="booking.html" class="cta-button">Book a Session</a>
    </div>
  </section>

  <!-- ABOUT -->
  <section id="about">
    <div class="container">
      <div class="section-header">
        <h2>About Me</h2>
      </div>
      <div class="about-content">
        <div>
          <p>Photographer based in the NYC area specializing in sports and portrait work.</p>
        </div>
        <img src="images/about.jpg" alt="About" class="about-image">
      </div>
    </div>
  </section>

  <!-- PORTFOLIO -->
  <section id="portfolio">
    <div class="container">
      <div class="section-header">
        <h2>Portfolio Preview</h2>
      </div>
      <div class="carousel-container">
        <div class="carousel-track" id="portfolio-carousel"></div>
      </div>
    </div>
  </section>

  <!-- GALLERY / SHOP -->
  <section id="gallery">
    <div class="container">
      <div class="section-header">
        <h2>Shop Prints</h2>
      </div>
      <div class="photo-grid" id="gallery-grid"></div>
    </div>
  </section>

  <footer>
    © 2026 Jesse Reilly Photography
  </footer>

  <!-- SCRIPT -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {

      const carousel = document.getElementById('portfolio-carousel');
      const carouselImages = [
        'images/sports/photo1.jpg',
        'images/sports/photo2.jpg',
        'images/sports/photo3.jpg',
        'images/sports/photo4.jpg',
        'images/portraits/photo1.jpg',
        'images/portraits/photo2.jpg',
        'images/portraits/photo3.jpg',
        'images/creative/photo1.jpg',
        'images/creative/photo2.jpg',
        'images/creative/photo3.jpg'
      ];

      const doubledCarousel = carouselImages.concat(carouselImages);

      doubledCarousel.forEach(src => {
        const div = document.createElement('div');
        div.className = 'carousel-item';
        div.innerHTML = `<img src="${src}" alt="">`;
        carousel.appendChild(div);
      });

      const gallery = document.getElementById('gallery-grid');
      const galleryImages = [
        'images/gallery/photo1.jpg',
        'images/gallery/photo2.jpg',
        'images/gallery/photo3.jpg',
        'images/gallery/photo4.jpg',
        'images/gallery/photo5.jpg',
        'images/gallery/photo6.jpg'
      ];

      galleryImages.forEach(src => {
        const div = document.createElement('div');
        div.className = 'photo-item';
        div.innerHTML = `
          <img src="${src}" alt="">
          <div class="photo-overlay">
            <a href="https://jbrphotos.darkroom.com" target="_blank" class="buy-print-btn">
              Buy Print
            </a>
          </div>
        `;
        gallery.appendChild(div);
      });

    });
  </script>

</body>
</html>
