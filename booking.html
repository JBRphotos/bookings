<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Session | Jesse Reilly Photography</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0a1628;
            --accent: #c9a45c;
            --white: #ffffff;
            --light: #f8f9fb;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background-color: var(--light);
            color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative; /* Allows the back button to position correctly */
        }

        /* --- BACK BUTTON STYLE --- */
        .back-nav {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 1000;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--accent);
        }
        /* -------------------------- */

        .booking-container {
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--accent);
            color: var(--primary);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .back-nav {
                top: 15px;
                left: 15px;
            }
            .booking-container {
                padding: 25px;
                margin-top: 50px;
            }
        }
    </style>
</head>
<body>

    <nav class="back-nav">
        <a href="index.html" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Portfolio
        </a>
    </nav>

    <div class="booking-container">
        <h1>Book a Session</h1>
        <p class="subtitle">Capture your best moments. Send a request below.</p>
        
        <form action="https://formspree.io/f/mjkgpnpk" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="type">Session Type</label>
                <select id="type" name="type" required>
                    <option value="" disabled selected>Select a session type</option>
                    <option value="sports">Sports Photography</option>
                    <option value="portrait">Individual Portraits</option>
                    <option value="graduation">Graduation/Senior Photos</option>
                    <option value="creative">Creative Projects</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Preferred Date</label>
                <input type="date" id="date" name="date">
            </div>

            <div class="form-group">
                <label for="message">Session Details</label>
                <textarea id="message" name="message" placeholder="Tell me more about your session..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Request</button>
        </form>
    </div>

</body>
</html>
