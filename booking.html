<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesse Reilly Photography - Book Your Session</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0a1628;
            --secondary: #1e3a5f;
            --accent: #c9a45c;
            --light: #f8f9fb;
            --white: #ffffff;
            --success: #2d5a3d;
            --error: #8b2e2e;
            --navy: #14213d;
            --gold: #daa520;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: linear-gradient(135deg, #e8eef5 0%, #d4dce8 100%);
            color: var(--primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* --- BACK BUTTON STYLE --- */
        .back-nav {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2000; /* Keeps it above the header */
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--white);
            font-weight: 500;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .back-link:hover {
            background: var(--accent);
            color: var(--primary);
            border-color: var(--accent);
        }
        /* -------------------------- */

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--white);
            margin-bottom: 40px;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 8px 30px rgba(10, 22, 40, 0.15);
            position: relative;
        }

        .admin-access-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: var(--white);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .admin-access-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .logo {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            background: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            overflow: hidden;
            border: 3px solid var(--accent);
        }

        .logo img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .instagram {
            margin-top: 10px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .instagram a {
            color: var(--accent);
            text-decoration: none;
        }

        .packages {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .package {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(10, 22, 40, 0.08);
            transition: all 0.3s;
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
        }

        .package:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(10, 22, 40, 0.15);
            border-color: var(--accent);
        }
