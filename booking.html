<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Session | Jesse Reilly Photography</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a1628;
            --accent: #c9a45c;
            --white: #ffffff;
            --light: #f8f9fb;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background-color: var(--light);
            color: var(--primary);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- NEW BACK BUTTON STYLES --- */
        .back-button {
            position: fixed;
            top: 25px;
            left: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
            background: var(--white);
            padding: 10px 18px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-button:hover {
            transform: translateX(-5px);
            background: var(--primary);
            color: var(--white);
        }

        .back-button svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        /* ------------------------------ */

        .booking-container {
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--secondary, #1e3a5f);
            background-color: var(--accent);
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .back-button {
                top: 15px;
                left: 15px;
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-button">
        <svg viewBox="0 0 24 24"><path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"></path></svg>
        Back to Portfolio
    </a>

    <div class="booking-container">
        <h1>Book a Session</h1>
        <p class="subtitle">Fill out the form below and I'll get back to you within 24 hours.</p>
        
        <form action="https://formspree.io/f/your-id-here" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label for="type">Session Type</label>
                <select id="type" name="type" required>
                    <option value="" disabled selected>Select a category</option>
                    <option value="sports">Sports Action</option>
                    <option value="portrait">Individual Portrait</option>
                    <option value="graduation">Graduation</option>
                    <option value="creative">Creative/Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Preferred Date</label>
                <input type="date" id="date" name="date">
            </div>

            <div class="form-group">
                <label for="message">Session Details</label>
                <textarea id="message" name="message" placeholder="Tell me about what you're looking for..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Booking Request</button>
        </form>
    </div>

</body>
</html>
