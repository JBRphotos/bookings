<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesse Reilly Photography - Book Your Session</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0a1628;
            --secondary: #1e3a5f;
            --accent: #c9a45c;
            --light: #f8f9fb;
            --white: #ffffff;
            --success: #2d5a3d;
            --error: #8b2e2e;
            --navy: #14213d;
            --gold: #daa520;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: linear-gradient(135deg, #e8eef5 0%, #d4dce8 100%);
            color: var(--primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* --- BACK BUTTON STYLE --- */
        .back-nav {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2000;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--white);
            font-weight: 500;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .back-link:hover {
            background: var(--accent);
            color: var(--primary);
            border-color: var(--accent);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--white);
            margin-bottom: 40px;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 8px 30px rgba(10, 22, 40, 0.15);
            position: relative;
        }

        .admin-access-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: var(--white);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .admin-access-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .logo {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            background: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            overflow: hidden;
            border: 3px solid var(--accent);
        }

        .logo img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        .logo-placeholder {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--primary);
            font-weight: 700;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .instagram {
            margin-top: 10px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .instagram a {
            color: var(--accent);
            text-decoration: none;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #ddd;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
            font-family: 'Work Sans', sans-serif;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--accent);
        }

        .tab:hover {
            color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .packages {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .package {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(10, 22, 40, 0.08);
            transition: all 0.3s;
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
        }

        .package:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(10, 22, 40, 0.15);
            border-color: var(--accent);
        }

        .package.selected {
            border-color: var(--accent);
            background: linear-gradient(135deg, var(--white) 0%, #f5f7fa 100%);
            box-shadow: 0 8px 25px rgba(201, 164, 92, 0.2);
        }

        .package-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .package-price {
            font-size: 2rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .package-details {
            list-style: none;
            margin-bottom: 10px;
        }

        .package-details li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }

        .package-details li:last-child {
            border-bottom: none;
        }

        .package-note {
            font-size: 0.85rem;
            color: #666;
            font-style: italic;
            margin-top: 10px;
        }

        .form-section {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(10, 22, 40, 0.08);
            margin-bottom: 30px;
        }

        .form-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--secondary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--primary);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Work Sans', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.1);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .addon-group {
            display: grid;
            gap: 10px;
        }

        .addon {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .addon input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        .addon label {
            margin: 0;
            font-weight: 400;
            cursor: pointer;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Work Sans', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--navy) 100%);
            color: var(--white);
            width: 100%;
            border: 2px solid transparent;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 58, 95, 0.3);
            border-color: var(--accent);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: var(--primary);
            margin-right: 10px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-content h3 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--secondary);
            margin-bottom: 15px;
        }

        .bookings-list {
            margin-top: 20px;
        }

        .booking-card {
            background: var(--white);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(10, 22, 40, 0.08);
            margin-bottom: 15px;
            text-align: left;
            border-left: 4px solid var(--accent);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .booking-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .booking-date {
            font-size: 0.85rem;
            color: #666;
        }

        .booking-details {
            display: grid;
            gap: 5px;
            font-size: 0.9rem;
            color: #555;
        }

        .booking-package {
            font-weight: 500;
            color: var(--secondary);
            margin-top: 8px;
        }

        .export-btn {
            margin-top: 20px;
        }

        .email-preview {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
            border: 1px solid #ddd;
        }

        .email-preview pre {
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .copy-btn {
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .packages {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-direction: column;
            }

            .tab {
                border-left: 3px solid transparent;
                border-bottom: none;
            }

            .tab.active {
                border-left-color: var(--accent);
                border-bottom-color: transparent;
            }
        }
    </style>
</head>
